<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CyberVault - Your comprehensive cybersecurity knowledge, intelligence, learning and community platform." />
    <meta name="theme-color" content="#030712" />
    <title>CyberVault — Cybersecurity Intelligence Platform</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
      }
      html.dark, html.dark body {
        background-color: #030712;
        color: #f3f4f6;
      }
      html.light, html.light body {
        background-color: #ffffff;
        color: #111827;
      }
    </style>
    <script>
      (function() {
        function applyTheme(theme) {
          document.documentElement.classList.remove('light', 'dark');
          document.documentElement.classList.add(theme);
          document.documentElement.setAttribute('data-theme', theme);
        }
        var stored = localStorage.getItem('cybervault-theme');
        if (stored === 'light' || stored === 'dark') {
          applyTheme(stored);
        } else {
          applyTheme(window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
